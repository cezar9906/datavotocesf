<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataVotoCesf — Entrar</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>
  <header class="header">
    <h1>DataVotoCesf</h1>
    <p>Entre para acessar o painel de resultados</p>
  </header>

  <main class="container">
    <div class="card auth-card">
      <div class="tabs">
        <button class="tab ativo" data-tab="login">Entrar</button>
        <button class="tab" data-tab="cadastro">Cadastrar</button>
      </div>

      <!-- FORM LOGIN -->
      <form id="form-login" class="form-auth">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="seu@email.com" required />
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" required />
        <button type="submit" id="btn-login">Entrar</button>
        <p class="msg-auth" id="msg-login" role="status"></p>
      </form>

      <!-- FORM CADASTRO -->
      <form id="form-cadastro" class="form-auth" hidden>
        <label for="cad-email">Email</label>
        <input type="email" id="cad-email" placeholder="seu@email.com" required />
        <label for="cad-senha">Senha (mín. 6 caracteres)</label>
        <input type="password" id="cad-senha" placeholder="••••••••" minlength="6" required />
        <label for="cad-senha2">Confirmar senha</label>
        <input type="password" id="cad-senha2" placeholder="••••••••" minlength="6" required />
        <button type="submit" id="btn-cad">Criar conta</button>
        <p class="msg-auth" id="msg-cad" role="status"></p>
      </form>

      <p class="link-voltar">
        <a href="index.html">← Voltar para a pesquisa</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>Projeto Integrado de Backend • Colégio Sagrada Família</p>
  </footer>

  <!-- Aqui está a mágica: chamando o arquivo JS correto -->
  <script type="module" src="JS/login.js"></script>
</body>
</html>
