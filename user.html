<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataVotoCesf — Resultados</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>
  <header class="header">
    <h1>Resultados da Pesquisa</h1>
    <p>Visão pública — DataVotoCesf</p>
    <div class="user-bar">
      <span id="user-email">Carregando…</span>
      <button id="btn-logout" class="btn-logout">Sair</button>
    </div>
  </header>

  <main class="container">
    <section id="painel" hidden>
      <div class="metricas">
        <div class="card metrica">
          <span class="metrica-label">Total de respostas</span>
          <strong id="total-respostas">0</strong>
        </div>
      </div>
      <div class="card">
        <h3>Intenção de Voto</h3>
        <canvas id="grafico-votos"></canvas>
      </div>
      <div class="card">
        <h3>Pautas Prioritárias</h3>
        <canvas id="grafico-pautas"></canvas>
      </div>
      <p class="aviso-permissao">
        🔒 Dados detalhados visíveis apenas para administradores.
      </p>
    </section>
  </main>

  <footer class="footer">
    <p>Projeto Integrado de Backend • Colégio Sagrada Família</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="JS/user.js"></script>
</body>
</html>
