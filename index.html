<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataVotoCesf — Pesquisa Oficial</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>
  <header class="header">
    <h1>DataVotoCesf</h1>
    <p>Pesquisa Socioeconômica e Eleitoral — Campo Largo / PR</p>
    <span class="badge">100% Anônimo</span>
    <div class="user-bar">
      <a href="login.html" style="color: white; text-decoration: underline; font-weight: bold; font-size: 0.9rem;">Acessar Painel (Login)</a>
    </div>
  </header>

  <main class="container">
    <form id="form-pesquisa" novalidate>
      <div class="secao-form">
        <h2>1. Seu Perfil</h2>
        <label for="idade">Qual a sua idade?</label>
        <input type="number" id="idade" name="idade" min="16" max="120" placeholder="Ex: 25" required />
        <label for="genero">Gênero</label>
        <select id="genero" name="genero" required>
          <option value="">Selecione...</option>
          <option value="Feminino">Feminino</option>
          <option value="Masculino">Masculino</option>
          <option value="Outro">Outro / Prefiro não informar</option>
        </select>
        <label for="bairro">Em qual bairro de Campo Largo você mora?</label>
        <select id="bairro" name="bairro" required>
          <option value="">Selecione seu bairro...</option>
          <option value="Centro">Centro</option>
          <option value="Águas Claras">Águas Claras</option>
          <option value="Bateias">Bateias</option>
          <option value="Cercadinho">Cercadinho</option>
          <option value="Ferraria">Ferraria</option>
          <option value="Itaqui">Itaqui</option>
          <option value="Jardim Amélia">Jardim Amélia</option>
          <option value="Ouro Verde">Ouro Verde</option>
          <option value="Rondinha">Rondinha</option>
          <option value="Santa Cruz">Santa Cruz</option>
          <option value="São Silvestre">São Silvestre</option>
          <option value="Vila Nova">Vila Nova</option>
          <option value="Outro">Outro</option>
        </select>
      </div>

      <div class="secao-form">
        <h2>2. Dados Socioeconômicos</h2>
        <label for="escolaridade">Escolaridade</label>
        <select id="escolaridade" name="escolaridade" required>
          <option value="">Selecione...</option>
          <option value="Fundamental">Ensino Fundamental</option>
          <option value="Médio">Ensino Médio</option>
          <option value="Superior">Ensino Superior</option>
          <option value="Pós-graduação">Pós-graduação</option>
        </select>
        <label for="renda">Renda familiar mensal</label>
        <select id="renda" name="renda" required>
          <option value="">Selecione...</option>
          <option value="Até 1 SM">Até 1 salário mínimo (até R$ 1.412)</option>
          <option value="1 a 2 SM">De 1 a 2 salários mínimos</option>
          <option value="2 a 5 SM">De 2 a 5 salários mínimos</option>
          <option value="5 a 10 SM">De 5 a 10 salários mínimos</option>
          <option value="Mais de 10 SM">Mais de 10 salários mínimos</option>
        </select>
        <div class="linha-dupla">
          <div>
            <label for="moradores">Moradores na casa</label>
            <input type="number" id="moradores" name="moradores" min="1" max="20" required />
          </div>
          <div>
            <label for="trabalhadores">Pessoas que trabalham</label>
            <input type="number" id="trabalhadores" name="trabalhadores" min="0" max="20" required />
          </div>
        </div>
      </div>

      <div class="secao-form">
        <h2>3. Intenção de Voto</h2>
        <label for="intencaoVoto">Se a eleição para Prefeito de Campo Largo fosse hoje, em quem você votaria?</label>
        <select id="intencaoVoto" name="intencaoVoto" required>
          <option value="">Selecione...</option>
          <option value="Maurício Rivabem">Maurício Rivabem</option>
          <option value="Marcelo Puppi">Marcelo Puppi</option>
          <option value="Rui Furlan">Rui Furlan</option>
          <option value="Vilmar Basso">Vilmar Basso</option>
          <option value="Branco/Nulo">Branco / Nulo</option>
          <option value="Indeciso">Ainda não sei / Indeciso</option>
        </select>
        <label for="certezaVoto">O quão decidido você está sobre esse voto?</label>
        <select id="certezaVoto" name="certezaVoto" required>
          <option value="">Selecione...</option>
          <option value="Totalmente decidido">Totalmente decidido(a)</option>
          <option value="Parcialmente decidido">Parcialmente decidido(a)</option>
          <option value="Ainda posso mudar">Ainda posso mudar</option>
        </select>
        <fieldset>
          <legend>Quais são as pautas prioritárias para a sua cidade? (Marque até 3)</legend>
          <div class="grid-checkboxes">
            <label><input type="checkbox" name="pautas" value="Saúde" /> Saúde</label>
            <label><input type="checkbox" name="pautas" value="Educação" /> Educação</label>
            <label><input type="checkbox" name="pautas" value="Segurança" /> Segurança Pública</label>
            <label><input type="checkbox" name="pautas" value="Emprego" /> Geração de Emprego</label>
            <label><input type="checkbox" name="pautas" value="Infraestrutura" /> Infraestrutura</label>
            <label><input type="checkbox" name="pautas" value="Transporte" /> Transporte Público</label>
            <label><input type="checkbox" name="pautas" value="Meio Ambiente" /> Meio Ambiente</label>
            <label><input type="checkbox" name="pautas" value="Cultura" /> Cultura e Lazer</label>
          </div>
        </fieldset>
      </div>

      <button type="submit" id="btn-enviar">Enviar Minhas Respostas</button>
      <p id="mensagem" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="footer">
    <p>Projeto Integrado de Backend • Colégio Sagrada Família</p>
  </footer>

  <script type="module" src="JS/script.js"></script>
</body>
</html>
