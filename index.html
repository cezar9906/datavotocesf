<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataVotoCesf - Pesquisa Campo Largo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <span style="font-size: 0.8rem; font-weight: bold; color: #718096;">DataVotoCesf</span>
      <!-- Botão para ir para a tela de admin -->
      <a href="admin.html" style="background: #edf2f7; color: #2b6cb0; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: bold;">Painel Admin 🔒</a>
    </div>

    <h1>Pesquisa Eleitoral DataVotoCesf</h1>
    <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 0.85rem;">
      Pesquisa socioeconômica e eleitoral anônima — Colégio Sagrada Família / Campo Largo (PR).
    </p>

    <form id="pollForm">
      <label>Faixa Etária:
        <select id="faixaEtaria" required>
          <option value="">Selecione...</option>
          <option value="16-17">16 a 17 anos</option>
          <option value="18-29">18 a 29 anos</option>
          <option value="30-49">30 a 49 anos</option>
          <option value="50-64">50 a 64 anos</option>
          <option value="65+">65 anos ou mais</option>
        </select>
      </label>

      <label>Região / Bairro de Campo Largo:
        <select id="bairro" required>
          <option value="">Selecione seu bairro...</option>
          <option value="Centro">Centro</option>
          <option value="Águas Claras">Águas Claras</option>
          <option value="Aparecida">Aparecida</option>
          <option value="Botiatuva">Botiatuva</option>
          <option value="Ferrari">Ferrari</option>
          <option value="Itaboa">Itaboa</option>
          <option value="Jardim Melpomeni">Jardim Melpomeni</option>
          <option value="Rondinha">Rondinha</option>
          <option value="Vila Itaqui">Vila Itaqui</option>
          <option value="Zona Rural / Interior">Zona Rural / Interior</option>
          <option value="Outro">Outro bairro</option>
        </select>
      </label>

      <label>Ocupação / Rotina Atual:
        <select id="rotina" required>
          <option value="">Selecione...</option>
          <option value="Apenas Estuda">Apenas Estuda</option>
          <option value="Apenas Trabalha">Apenas Trabalha</option>
          <option value="Estuda e Trabalha">Estuda e Trabalha</option>
          <option value="Desempregado / Procurando">Desempregado(a)</option>
          <option value="Aposentado / Pensionista">Aposentado(a) / Pensionista</option>
        </select>
      </label>

      <label>Renda Familiar Mensal:
        <select id="renda" required>
          <option value="">Selecione...</option>
          <option value="Até 1 salário mínimo">Até 1 salário mínimo</option>
          <option value="De 1 a 3 salários mínimos">De 1 a 3 salários mínimos</option>
          <option value="De 3 a 5 salários mínimos">De 3 a 5 salários mínimos</option>
          <option value="Mais de 5 salários mínimos">Mais de 5 salários mínimos</option>
          <option value="Preferiu não informar">Preferiu não informar</option>
        </select>
      </label>

      <label>Nº de Moradores na Residência:
        <input type="number" id="moradores" min="1" max="20" placeholder="Ex: 4" required>
      </label>

      <label>Nº de Pessoas que Trabalham na Residência:
        <input type="number" id="trabalhadores" min="0" max="20" placeholder="Ex: 2" required>
      </label>

      <label>Intenção de Voto para Prefeito:
        <select id="candidatoPrefeito" required>
          <option value="">Em quem você votaria?</option>
          <option value="Mauricio Rivabem">Mauricio Rivabem (PSD)</option>
          <option value="Christiano Puppi">Christiano Puppi (PP)</option>
          <option value="Jean Naiser">Jean Naiser (PMB)</option>
          <option value="Edson Basso">Edson Basso (PSB)</option>
          <option value="Lino Petry">Lino Petry (PV)</option>
          <option value="Branco / Nulo">Branco / Nulo</option>
          <option value="Indeciso / Não sei">Indeciso / Não sei</option>
        </select>
      </label>

      <label>Rejeição (Em quem você NUNCA votaria):
        <select id="rejeicaoPrefeito" required>
          <option value="">Selecione...</option>
          <option value="Mauricio Rivabem">Mauricio Rivabem (PSD)</option>
          <option value="Christiano Puppi">Christiano Puppi (PP)</option>
          <option value="Jean Naiser">Jean Naiser (PMB)</option>
          <option value="Edson Basso">Edson Basso (PSB)</option>
          <option value="Lino Petry">Lino Petry (PV)</option>
          <option value="Rejeito Todos">Rejeito Todos</option>
          <option value="Não Rejeito Nenhum">Não Rejeito Nenhum</option>
        </select>
      </label>

      <label>Certeza do Voto:
        <select id="certezaVoto" required>
          <option value="">Selecione...</option>
          <option value="Totalmente decidido">Totalmente decidido</option>
          <option value="Certo, mas pode mudar">Certo, mas pode mudar</option>
          <option value="Indeciso">Indeciso</option>
        </select>
      </label>

      <label>Avaliação da Atual Gestão da Prefeitura:
        <select id="avaliacaoGestao" required>
          <option value="">Selecione...</option>
          <option value="Ótima / Boa">Ótima / Boa</option>
          <option value="Regular">Regular</option>
          <option value="Ruim / Péssima">Ruim / Péssima</option>
          <option value="Não sei avaliar">Não sei avaliar</option>
        </select>
      </label>

      <label>Pauta Prioritária para Campo Largo:
        <select id="pauta" required>
          <option value="">Qual área precisa de mais atenção?</option>
          <option value="Saúde (Postos e Hospitais)">Saúde e Atendimento Médico</option>
          <option value="Educação e Creches">Educação e Vagas em Creches</option>
          <option value="Segurança Pública">Segurança e Policiamento</option>
          <option value="Transporte Público">Transporte Público</option>
          <option value="Pavimentação e Asfalto">Pavimentação e Asfalto</option>
          <option value="Geração de Empregos">Geração de Empregos</option>
          <option value="Lazer e Esporte">Lazer, Cultura e Esporte</option>
        </select>
      </label>

      <button type="submit">Enviar Resposta Anônima</button>
    </form>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
